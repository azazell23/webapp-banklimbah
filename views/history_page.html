<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Limbah | History</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
    <link rel="stylesheet" href="../css/history.css">
</head>
<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div class="nav-left">
            <img src="https://i.imgur.com/GRXWmeI.png" class="logo" alt="Logo">
        </div>

        <div class="nav-right">
            <a href="#" class="nav-link">Pricing</a>
            <a href="#" class="nav-link">Contact</a>
            <div id="profile">
                <span class="material-symbols-outlined">account_circle</span>
                <span class="material-symbols-outlined">stat_minus_1</span>
            </div>
        </div>
    </nav>

    <!-- HEADER -->
    <header class="header">
        <h1>History</h1>
        <span class="subtitle">Riwayat Penjualan</span>
    </header>

    <!-- FILTER BUTTONS -->
    <section class="filter-section">
        <span class="filter-label">Status</span>

        <button class="filter-btn">Semua</button>
        <button class="filter-btn">Berlangsung</button>
        <button class="filter-btn active">Selesai</button>
    </section>

    <!-- PRODUCT CARD -->
    <div class="product-card">
        <div class="left">
            <img class="product-img" src="https://firebasestorage.googleapis.com/v0/b/kepul-apps.appspot.com/o/products%2FSampahOutline_Plastik%20-%20Atom%20Hitam.png?alt=media&token=9e08077b-c569-44bb-9f71-80cbbcebe78b">

            <div class="product-info">
                <div class="top-row">
                    <span class="date">24 Oktober 2025</span>
                    <span class="badge">Selesai</span>
                </div>

                <h3 class="title">Plastik</h3>
                <span class="amount">Anton Hitam x 20</span>
            </div>
        </div>

        <div class="right">
            <span class="sales-label">Total Penjualan</span>
            <span class="sales-amount">Rp. 10.000</span>
        </div>
    </div>

</body>
</html>
